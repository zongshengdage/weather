<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>宣城市短时强降水与强对流短临预报</title>
<style>
body{font-family:"Microsoft YaHei","SimHei",sans-serif;background:#f3f5f7;margin:0;color:#111}
.sheet{max-width:1080px;margin:18px auto;background:#fff;padding:28px 34px 42px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.time{text-align:center;font-size:16px;color:#555;margin-bottom:18px}
.alert-title{color:#d90000;font-size:28px;font-weight:800;margin:22px 0 12px;line-height:1.35}
.county-line{font-size:21px;font-weight:700;line-height:1.65}
.prob{color:#d90000;font-size:22px;font-weight:800;line-height:1.65;margin:26px 0}
.section-title{font-size:24px;font-weight:800;margin:26px 0 12px}
.note{background:#fff7e6;border-left:5px solid #f59e0b;padding:12px 14px;line-height:1.7;font-size:15px;color:#5f4300}
img.product{display:block;width:100%;height:auto;margin:10px auto 26px;border:1px solid #ddd}
.footer{font-size:13px;color:#777;text-align:center;margin-top:30px}
@media(max-width:700px){.sheet{margin:0;padding:18px 15px}.alert-title{font-size:22px}.county-line{font-size:17px}.prob{font-size:18px}}
</style></head><body><main class="sheet">
<div class="time">起报时间：北京时 2026-08-28 09:48</div>
<div class="alert-title">未来一小时降水量超过 20 毫米的乡镇：</div><div class="county-line">无</div>
<div class="alert-title">未来三小时降水量超过 50 毫米的乡镇：</div><div class="county-line">无</div>
<div class="alert-title">未来三小时雷暴大风（组合反射率 > 55 dBZ）的乡镇：</div><div class="county-line">无</div>
<div class="prob">最大降水量概率预估：宣城市范围内未来三小时累计降水达到50毫米概率约8%，达到80毫米概率约0%，达到100毫米概率约0%。</div>
<div class="section-title">未来降水预报图：</div><img class="product auto-refresh-product" data-src="短临降水预报.png" src="短临降水预报.png?v=20260828095351" alt="未来降水预报图">
<div class="section-title">未来三小时组合反射率图：</div><img class="product auto-refresh-product" data-src="未来3小时组合反射率.png" src="未来3小时组合反射率.png?v=20260828095351" alt="未来三小时组合反射率图">
<div class="section-title">未来三小时雷暴大风图：</div><img class="product auto-refresh-product" data-src="未来3小时雷暴大风.png" src="未来3小时雷暴大风.png?v=20260828095351" alt="未来三小时雷暴大风图">
<div class="footer">三张产品图每 60 秒自动刷新一次；每次请求自动附加新的URL参数以绕过缓存。</div>
<script>
(function() {
    const refreshMs = 60 * 1000;
    function refreshProductImages() {
        const stamp = Date.now();
        document.querySelectorAll('img.auto-refresh-product').forEach(function(img, index) {
            const base = img.getAttribute('data-src');
            if (!base) return;
            img.src = base + '?v=' + stamp + '_' + index;
        });
    }
    window.setInterval(refreshProductImages, refreshMs);
})();
</script>
</main></body></html>
